name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Build backend
        run: |
          cd backend
          npm run build:prod
        env:
          NODE_ENV: production

      - name: Prune devDependencies
        run: |
          cd backend
          npm prune --production --legacy-peer-deps

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist
            backend/node_modules
            backend/package.json
            backend/ecosystem.config.js
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/build-placeholder

      - name: Prune devDependencies
        run: npm prune --production --legacy-peer-deps

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next
            public
            node_modules
            package.json
            next.config.js
            tsconfig.json
            next-sitemap.config.js
            ecosystem.config.js
            app
            components
            lib
            hooks
            types
            tailwind.config.ts
            postcss.config.js
            components.json
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 15
    steps:
      - name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-artifact

      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifact

      - name: Prepare Deployment Archive
        run: |
          mkdir -p final-deploy/backend
          # Fix: Use '.' instead of '*' to ensure hidden files (like .next) are copied
          cp -r backend-artifact/. final-deploy/backend/
          cp -r frontend-artifact/. final-deploy/
          cd final-deploy
          tar -cf ../deployment.tar .

      - name: Transfer to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment.tar
          target: /home/${{ secrets.SERVER_USER }}/API-Radar
          timeout: 180s

      - name: Zero-Downtime Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            
            # Backup current state
            mkdir -p "$BACKUP_DIR"
            if [ -d .next ]; then
              tar -cf "$BACKUP_DIR/backup-$TIMESTAMP.tar" .next public backend/dist 2>/dev/null || true
              ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | tail -n +5 | xargs rm -f 2>/dev/null || true
            fi

            # Clean up old build artifacts to prevent "ghost" files
            rm -rf .next public/sitemap*.xml

            # Deploy new version
            tar -xf deployment.tar
            rm -f deployment.tar

            # Sequential Restart (Safer for 1GB RAM than Reload)
            # We use restart to clear memory before starting the new process
            
            # 1. Restart Backend
            pm2 restart api-radar-backend --update-env || (cd backend && pm2 start ecosystem.config.js)
            
            sleep 5

            # 2. Restart Frontend (Force reload config by deleting first)
            pm2 delete api-radar-frontend || true
            pm2 start ecosystem.config.js

            pm2 save --force

  notify-success:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    steps:
      - name: ✅ Notify
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, repo } = context;
            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'success', context: 'CI/CD Pipeline',
              description: 'Deployed successfully'
            });

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: 🔙 Rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            LATEST_BACKUP=$(ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | head -n 1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "Rolling back to $LATEST_BACKUP"
              tar -xf "$LATEST_BACKUP"
              pm2 restart api-radar-frontend
              pm2 restart api-radar-backend
              pm2 save --force
            else
              echo "No backup found for rollback"
              exit 1
            fi


