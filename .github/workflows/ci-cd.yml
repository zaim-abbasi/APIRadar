name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/build-placeholder

      - name: Package standalone build
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          tar -cf frontend-build.tar .next/standalone

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar
          retention-days: 1

  build_backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd backend && npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: backend/dist/.tsbuildinfo
          key: ${{ runner.os }}-tsc-backend-${{ hashFiles('backend/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-backend-

      - name: Build backend
        run: cd backend && npm run build:prod
        env:
          NODE_ENV: production

      - name: Package backend build
        run: |
          tar -cf backend-build.tar \
            backend/dist \
            backend/package.json \
            backend/package-lock.json \
            backend/ecosystem.config.js

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-build.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    timeout-minutes: 10
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cd deploy
          tar -xf ../frontend-build.tar
          tar -xf ../backend-build.tar
          cd ..
          tar -cf deployment.tar -C deploy .

      - name: Transfer
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment.tar
          target: /home/${{ secrets.SERVER_USER }}/API-Radar
          timeout: 60s

      - name: Deploy
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP="$BACKUP_DIR/backup-$TIMESTAMP.tar"

            mkdir -p "$BACKUP_DIR"

            if [ -d .next ] || [ -d backend/dist ]; then
              tar -cf "$BACKUP" \
                .next/standalone backend/dist \
                backend/package.json backend/package-lock.json \
                backend/ecosystem.config.js 2>/dev/null || true
              [ -f "$BACKUP" ] || exit 1
              ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | tail -n +3 | xargs rm -f 2>/dev/null || true
            fi

            tar -xf deployment.tar && rm -f deployment.tar

            (cd backend && (npm ci --no-audit --no-fund --legacy-peer-deps --omit=dev || \
              npm install --no-audit --no-fund --legacy-peer-deps --omit=dev))

            pm2 list | grep -q "api-radar-backend.*online" && pm2 reload api-radar-backend --update-env 2>/dev/null || \
              (cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend)

            pm2 list | grep -q "api-radar-frontend.*online" && pm2 delete api-radar-frontend 2>/dev/null || true
            cp .env.production .next/standalone/.env.production 2>/dev/null || true
            cp .env.local .next/standalone/.env.local 2>/dev/null || true
            pm2 start .next/standalone/server.js --name "api-radar-frontend" --cwd /home/${{ secrets.SERVER_USER }}/API-Radar --node-args="--max-old-space-size=512" -- -p 3000

            pm2 save --force
            sleep 10

            if ! (pm2 list | grep -q "api-radar-backend.*online" && pm2 list | grep -q "api-radar-frontend.*online"); then
              pm2 logs --lines 100 --nostream
              exit 1
            fi

  notify-success:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Notify Success
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'success', context: 'CI/CD Pipeline',
              description: 'Deployed successfully', target_url: url
            });

            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## Deployment Successful\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Time:** ${new Date().toISOString()}\n\n**Live:** https://apiradar.bot.nu | https://api.apiradar.bot.nu\n\n[Workflow](${url})`
              });
            }

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Rollback
        id: rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            BACKUP=$(ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | head -n 1)
            if [ -z "$BACKUP" ] || [ ! -f "$BACKUP" ]; then
              exit 1
            fi
            tar -xf "$BACKUP"

            pm2 list | grep -q "api-radar-backend.*online" && pm2 reload api-radar-backend --update-env 2>/dev/null || \
              (cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend)

            pm2 list | grep -q "api-radar-frontend.*online" && pm2 delete api-radar-frontend 2>/dev/null || true
            cp .env.production .next/standalone/.env.production 2>/dev/null || true
            cp .env.local .next/standalone/.env.local 2>/dev/null || true
            pm2 start .next/standalone/server.js --name "api-radar-frontend" --cwd /home/${{ secrets.SERVER_USER }}/API-Radar --node-args="--max-old-space-size=512" -- -p 3000

            pm2 save --force
            sleep 5
            pm2 list | grep -q "api-radar-backend.*online" && pm2 list | grep -q "api-radar-frontend.*online" || exit 1

      - name: Notify Rollback
        if: steps.rollback.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'success', context: 'CI/CD Pipeline - Rollback',
              description: 'Rollback completed', target_url: url
            });

            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## Rollback Completed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Time:** ${new Date().toISOString()}\n\nPrevious version restored.\n\n**Live:** https://apiradar.bot.nu | https://api.apiradar.bot.nu\n\n[Workflow](${url})`
              });
            }

      - name: Notify Failure
        if: steps.rollback.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'failure', context: 'CI/CD Pipeline',
              description: 'Deployment failed', target_url: url
            });

            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## Deployment Failed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n\nRollback attempted.\n\n[Workflow](${url})`
              });
            }
