name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: 🔨 Build backend
        run: |
          cd backend
          npm run build:prod
        env:
          NODE_ENV: production

      - name: 🔨 Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📦 Package
        run: |
          tar --exclude='node_modules' --exclude='.git' -cf deployment.tar \
            app components lib hooks types public package.json package-lock.json \
            backend/dist backend/package.json backend/package-lock.json \
            backend/ecosystem.config.js backend/tsconfig*.json \
            next.config.js tsconfig.json tailwind.config.ts postcss.config.js \
            components.json next-sitemap.config.js .next 2>/dev/null

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: deployment.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment

      - name: 🚀 Transfer
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT}}
          source: deployment.tar
          target: /home/${{ secrets.SERVER_USER }}/API-Radar

      - name: 🔄 Deploy
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT}}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP="$BACKUP_DIR/backup-$TIMESTAMP.tar"
            
            mkdir -p "$BACKUP_DIR"
            
            if [ -d .next ] || [ -d backend/dist ]; then
              tar -cf "$BACKUP" .next public package.json package-lock.json \
                backend/dist backend/package.json backend/package-lock.json \
                backend/ecosystem.config.js next.config.js 2>/dev/null || true
              [ -f "$BACKUP" ] || exit 1
              
              ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | tail -n +3 | xargs rm -f 2>/dev/null || true
            fi
            
            tar -xf deployment.tar && rm -f deployment.tar
            
            npm ci --prefer-offline --no-audit --legacy-peer-deps || \
              npm install --prefer-offline --no-audit --legacy-peer-deps
            
            cd backend && npm ci --prefer-offline --no-audit --legacy-peer-deps || \
              npm install --prefer-offline --no-audit --legacy-peer-deps
            
            pm2 list | grep -q "api-radar-backend.*online" && pm2 reload api-radar-backend --update-env 2>/dev/null || \
              (cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend)
            
            pm2 list | grep -q "api-radar-frontend.*online" && pm2 restart api-radar-frontend --update-env || \
              pm2 start npm --name api-radar-frontend -- start
            
            pm2 save --force
            sleep 2
            pm2 list | grep -q "api-radar-backend.*online" && pm2 list | grep -q "api-radar-frontend.*online" || exit 1

  notify-success:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: ✅ Notify
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'success', context: 'CI/CD Pipeline',
              description: 'Deployed successfully', target_url: url
            });
            
            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## ✅ Deployment Successful\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Time:** ${new Date().toISOString()}\n\n🌐 **Live:** https://apiradar.live | https://api.apiradar.live\n\n[Workflow](${url})`
              });
            }

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: 🔙 Rollback
        id: rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT}}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            BACKUP=$(ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | head -n 1)
            if [ -z "$BACKUP" ] || [ ! -f "$BACKUP" ]; then
              exit 1
            fi
            tar -xf "$BACKUP"
            
            pm2 list | grep -q "api-radar-backend.*online" && pm2 reload api-radar-backend --update-env 2>/dev/null || \
              (cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend)
            
            pm2 list | grep -q "api-radar-frontend.*online" && pm2 restart api-radar-frontend --update-env || \
              pm2 start npm --name api-radar-frontend -- start
            
            pm2 save --force

      - name: 🔄 Notify Rollback
        if: steps.rollback.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'success', context: 'CI/CD Pipeline - Rollback',
              description: 'Rollback completed', target_url: url
            });
            
            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## 🔄 Rollback Completed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Time:** ${new Date().toISOString()}\n\n✅ **Previous version restored.**\n\n🌐 **Live:** https://apiradar.live | https://api.apiradar.live\n\n[Workflow](${url})`
              });
            }

      - name: ❌ Notify Failure
        if: steps.rollback.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: 'failure', context: 'CI/CD Pipeline',
              description: 'Deployment failed', target_url: url
            });
            
            const prs = await github.rest.pulls.list({
              owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: repo.owner, repo: repo.repo, issue_number: prs.data[0].number,
                body: `## ❌ Deployment Failed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n\n🔄 **Rollback attempted.**\n\n[Workflow](${url})`
              });
            }
