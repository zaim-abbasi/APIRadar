name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ matrix.component == 'frontend' && 'npm' || '' }}

      - name: 💾 Cache backend dependencies
        if: matrix.component == 'backend'
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: 📦 Install dependencies
        if: matrix.component == 'frontend'
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: 📦 Install backend dependencies
        if: matrix.component == 'backend'
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: 🔨 Build backend
        if: matrix.component == 'backend'
        working-directory: ./backend
        run: npm run build:prod
        env:
          NODE_ENV: production

      - name: 🔨 Build frontend
        if: matrix.component == 'frontend'
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://apiradar.live
          MONGODB_URI: mongodb://dummy:27017/dummy
          NEXTAUTH_SECRET: dummy-secret-for-build
          NEXTAUTH_URL: https://apiradar.live

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-build
          path: ${{ matrix.component == 'frontend' && '.next public' || 'backend/dist' }}
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  notify-build-success:
    runs-on: ubuntu-latest
    needs: build
    if: success() && needs.build.result == 'success'
    steps:
      - name: ✅ Notify build success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CI/CD Pipeline - Build',
              description: 'Build completed successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  notify-build-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure() && needs.build.result == 'failure'
    steps:
      - name: 📢 Notify build failure
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner,
              repo: repo.repo,
              sha,
              state: 'failure',
              context: 'CI/CD Pipeline',
              description: 'Build failed - old version still running',
              target_url: url
            });
            
            try {
              const prs = await github.rest.pulls.list({
                owner: repo.owner,
                repo: repo.repo,
                state: 'open',
                head: `${repo.owner}:${branch}`
              });
              if (prs.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: prs.data[0].number,
                  body: `## ❌ Build Failed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n\n⚠️ **Old version is still running in production.**\n\n[Workflow logs](${url})`
                });
              }
            } catch {}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Create deployment package
        run: |
          tar --exclude='node_modules' --exclude='.git' -cf deployment.tar \
            .next public package.json package-lock.json \
            backend/dist backend/package.json backend/package-lock.json \
            backend/ecosystem.config.js next.config.js tsconfig.json \
            tailwind.config.ts postcss.config.js components.json 2>/dev/null

      - name: 🚀 Deploy to production
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deployment.tar"
          target: "/home/${{ secrets.SERVER_USER }}/API-Radar"
          strip_components: 0

      - name: 🔄 Deploy, backup and restart
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar"
            BACKUP_FILE="/home/${{ secrets.SERVER_USER }}/API-Radar-backup/backup-latest.tar"
            cd "${DEPLOY_DIR}"
            
            if [ -d .next ] || [ -d backend/dist ]; then
              mkdir -p "$(dirname "${BACKUP_FILE}")"
              rm -f "${BACKUP_FILE}"
              tar -cf "${BACKUP_FILE}" .next public package.json package-lock.json \
                backend/dist backend/package.json backend/package-lock.json \
                backend/ecosystem.config.js next.config.js 2>/dev/null || true
            fi
            
            tar -xf deployment.tar && rm -f deployment.tar
            
            if [ ! -d node_modules ] || [ package.json -nt node_modules/.package-lock.json ] 2>/dev/null; then
              npm ci --production --ignore-scripts --prefer-offline --no-audit --silent --legacy-peer-deps || \
              npm install --production --ignore-scripts --prefer-offline --no-audit --silent --legacy-peer-deps
            fi
            
            if [ ! -d backend/node_modules ] || [ backend/package.json -nt backend/node_modules/.package-lock.json ] 2>/dev/null; then
              cd backend
              npm ci --production --ignore-scripts --prefer-offline --no-audit --silent --legacy-peer-deps || \
              npm install --production --ignore-scripts --prefer-offline --no-audit --silent --legacy-peer-deps
              cd ..
            fi
            
            if pm2 list | grep -q "api-radar-backend.*online"; then
              pm2 reload api-radar-backend --update-env 2>/dev/null || pm2 restart api-radar-backend
            else
              cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend && cd ..
            fi
            
            if pm2 list | grep -q "api-radar-frontend.*online"; then
              pm2 restart api-radar-frontend --update-env
            else
              pm2 start npm --name api-radar-frontend -- start
            fi
            pm2 save --force
            
            for i in 0 1; do
              [ $i -eq 1 ] && sleep 1
              pm2 list | grep -q "api-radar-backend.*online" && pm2 list | grep -q "api-radar-frontend.*online" && break
              [ $i -eq 1 ] && echo "ERROR: Services failed to start" && pm2 logs api-radar-backend --lines 5 --nostream 2>/dev/null && pm2 logs api-radar-frontend --lines 5 --nostream 2>/dev/null && exit 1
            done

      - name: ✅ Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner,
              repo: repo.repo,
              sha,
              state: 'success',
              context: 'CI/CD Pipeline',
              description: 'Deployed successfully to production',
              target_url: url
            });
            
            try {
              const prs = await github.rest.pulls.list({ owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}` });
              if (prs.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: prs.data[0].number,
                  body: `## ✅ Deployment Successful\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Deployed:** ${new Date().toISOString()}\n\n🌐 **Live:** https://apiradar.live | https://api.apiradar.live\n\n[Workflow](${url})`
                });
              }
            } catch {}

      - name: ❌ Notify deployment failure
        if: failure() && steps.deploy.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner,
              repo: repo.repo,
              sha,
              state: 'failure',
              context: 'CI/CD Pipeline',
              description: 'Deployment failed - rolling back',
              target_url: url
            });
            
            try {
              const prs = await github.rest.pulls.list({ owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}` });
              if (prs.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: prs.data[0].number,
                  body: `## ❌ Deployment Failed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n\n🔄 **Rollback in progress...**\n\n[Workflow](${url})`
                });
              }
            } catch {}

      - name: 🔙 Rollback on failure
        id: rollback
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar"
            BACKUP_FILE="/home/${{ secrets.SERVER_USER }}/API-Radar-backup/backup-latest.tar"
            [ ! -f "$BACKUP_FILE" ] && echo "ERROR: No backup found" && exit 1
            cd "${DEPLOY_DIR}" && tar -xf "$BACKUP_FILE"
            
            if pm2 list | grep -q "api-radar-backend.*online"; then
              pm2 reload api-radar-backend --update-env 2>/dev/null || pm2 restart api-radar-backend
            else
              cd backend && pm2 start ecosystem.config.js --env production --name api-radar-backend && cd ..
            fi
            
            if pm2 list | grep -q "api-radar-frontend.*online"; then
              pm2 restart api-radar-frontend --update-env
            else
              pm2 start npm --name api-radar-frontend -- start
            fi
            pm2 save --force

      - name: 🔄 Notify rollback success
        if: always() && steps.rollback.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, ref, actor, runId, serverUrl, repo } = context;
            const branch = ref.replace('refs/heads/', '');
            const url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            await github.rest.repos.createCommitStatus({
              owner: repo.owner,
              repo: repo.repo,
              sha,
              state: 'success',
              context: 'CI/CD Pipeline - Rollback',
              description: 'Rollback completed successfully',
              target_url: url
            });
            
            try {
              const prs = await github.rest.pulls.list({ owner: repo.owner, repo: repo.repo, state: 'open', head: `${repo.owner}:${branch}` });
              if (prs.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: prs.data[0].number,
                  body: `## 🔄 Rollback Completed\n\n**Commit:** \`${sha.substring(0, 7)}\` | **Branch:** \`${branch}\` | **Author:** @${actor}\n**Rolled back:** ${new Date().toISOString()}\n\n✅ **Previous working version restored.**\n\n🌐 **Live:** https://apiradar.live | https://api.apiradar.live\n\n[Workflow](${url})`
                });
              }
            } catch {}
