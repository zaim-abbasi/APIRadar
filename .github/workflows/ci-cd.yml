name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Build backend
        run: |
          cd backend
          npm run build:prod
        env:
          NODE_ENV: production

      - name: Prune devDependencies
        run: |
          cd backend
          npm prune --production --legacy-peer-deps

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist
            backend/node_modules
            backend/package.json
            backend/ecosystem.config.js
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/build-placeholder

      - name: Prune devDependencies
        run: npm prune --production --legacy-peer-deps

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next
            public
            node_modules
            package.json
            next.config.js
            tsconfig.json
            next-sitemap.config.js
            ecosystem.config.js
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 15
    steps:
      - name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-artifact

      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifact

      - name: Prepare Deployment Archive
        run: |
          mkdir -p final-deploy/backend
          cp -r backend-artifact/* final-deploy/backend/
          cp -r frontend-artifact/* final-deploy/
          cd final-deploy
          tar -cf ../deployment.tar .

      - name: Transfer to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment.tar
          target: /home/${{ secrets.SERVER_USER }}/API-Radar
          timeout: 120s

      - name: Zero-Downtime Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/API-Radar
            BACKUP_DIR="/home/${{ secrets.SERVER_USER }}/API-Radar-backup"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            
            # Backup current state
            mkdir -p "$BACKUP_DIR"
            if [ -d .next ]; then
              tar -cf "$BACKUP_DIR/backup-$TIMESTAMP.tar" .next backend/dist 2>/dev/null || true
              ls -t "$BACKUP_DIR"/backup-*.tar 2>/dev/null | tail -n +3 | xargs rm -f 2>/dev/null || true
            fi

            # Deploy new version (Zero Install)
            tar -xf deployment.tar
            rm -f deployment.tar

            # Zero-Downtime Sequential Reload (Safe for 1GB RAM)
            # We reload one by one to avoid a simultaneous memory spike
            
            # 1. Reload Backend
            pm2 reload api-radar-backend --update-env || (cd backend && pm2 start ecosystem.config.js)
            
            # Brief pause to let backend settle
            sleep 5

            # 2. Reload Frontend
            pm2 reload api-radar-frontend --update-env || pm2 start ecosystem.config.js

            pm2 save --force

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Check Status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "state=success" >> $GITHUB_OUTPUT
            echo "msg=Deployed successfully" >> $GITHUB_OUTPUT
          else
            echo "state=failure" >> $GITHUB_OUTPUT
            echo "msg=Deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Status
        uses: actions/github-script@v7
        with:
          script: |
            const { sha, repo } = context;
            await github.rest.repos.createCommitStatus({
              owner: repo.owner, repo: repo.repo, sha,
              state: '${{ steps.status.outputs.state }}',
              context: 'CI/CD Pipeline',
              description: '${{ steps.status.outputs.msg }}'
            });


